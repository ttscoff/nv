<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send to nvALT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label class="title-field">
      Title
      <input id="note-title" type="text" />
    </label>
    <label class="readability">
      <input id="readability" type="checkbox" />
      Readability
    </label>
    <p id="status" hidden></p>
    <div class="menu">
      <button id="markdownify-url">Markdownify URL</button>
      <button id="markdownify-selection" disabled>Markdownify Selection</button>
      <button id="select-section">Select Section</button>
    </div>
    <div class="zoom">
      <button id="zoom-out" title="Zoom out">-</button>
      <button id="fit-vertical" title="Fit page to viewport height">Fit Height</button>
      <button id="zoom-in" title="Zoom in">+</button>
    </div>
    <script src="title.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
